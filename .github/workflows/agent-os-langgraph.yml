name: Agent OS LangGraph Gate

on:
  push:
    branches:
      - consolidate/agent-os-notoria
    paths:
      - "agent-os/langgraph/**"
      - "brands/majdi-personal-brand/SOURCE_LOCK.md"
      - ".github/workflows/agent-os-langgraph.yml"
  pull_request:
    branches:
      - main
    paths:
      - "agent-os/langgraph/**"
      - "brands/majdi-personal-brand/SOURCE_LOCK.md"
      - ".github/workflows/agent-os-langgraph.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-os/langgraph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run smoke test
        run: python -m aspar_agent.smoke
